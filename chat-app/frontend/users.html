<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Users</title>
    <style>
        #chatBox {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            border: 1px solid #ccc;
            padding: 10px;
            background: #f9f9f9;
            display: none;
        }

        #messages {
            height: 150px;
            overflow-y: auto;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            padding: 5px;
        }
    </style>
</head>

<body>
    <h2>All Users</h2>

    <div id="usersList"></div>

    <div id="chatBox">
        <h4 id="chatWith">Chat</h4>
        <div id="messages"></div>
        <input type="text" id="messageInput" placeholder="Type a message..." />
        <button id="sendBtn">Send</button>
    </div>

    <script>
        const user_id = Number(localStorage.getItem('user_id'));
        let unreadCounts = {}

        if (!user_id) {
            alert("User not logged in");
            window.location.href = "/home";
        }

        const ws = new WebSocket(`ws://localhost:3000?user_id=${user_id}`);

        ws.onopen = () => {
            console.log("WebSocket connected");
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === "chat_message") {

                // Case 1: no chat open → open it
                if (activeChatUserId === null) {
                    openChat(data.sender_id);
                    renderMessage(data);
                    return;
                }

                // Case 2: message from active chat
                if (data.sender_id === activeChatUserId) {
                    renderMessage(data);
                    return;
                }

                // Case 3: message from another user
                console.log(`New message from User ${data.sender_id}`);
            }
        };

        ws.onclose = () => {
            console.log("WebSocket disconnected");
        };

        ws.onerror = (err) => {
            console.error("WebSocket error:", err);
        };

        let activeChatUserId = null;

        async function openChat(userId) {
            activeChatUserId = userId;

            document.getElementById("chatBox").style.display = "block";
            document.getElementById("chatWith").textContent =
                `Chat with User ${userId}`;

            await loadConversation(userId);

            // mark as seen
            await fetch('/messages/seen', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: user_id,
                    other_user_id: Number(userId)
                })
            });

            // reset locally
            // unreadCounts[userId] = 0;
            loadUsers(); // refresh UI
        }

        function clearMessages() {
            document.getElementById("messages").innerHTML = "";
        }

        async function loadConversation(otherUserId) {
            const res = await fetch(
                `/messages?user1=${user_id}&user2=${otherUserId}`
            );

            const messages = await res.json();

            clearMessages();

            messages.forEach(message => {
                renderMessage(message);
            });
        }

        function renderMessage(message) {
            const messagesDiv = document.getElementById("messages");

            const p = document.createElement("p");

            if (message.sender_id === user_id) {
                p.textContent = `Me: ${message.message}`;
            } else {
                p.textContent = `User ${message.sender_id}: ${message.message}`;
            }

            messagesDiv.appendChild(p);
        }

        document.getElementById("sendBtn").addEventListener("click", () => {
            const input = document.getElementById("messageInput");
            const message = input.value.trim();

            if (!message || !activeChatUserId) {
                return;
            }

            const payload = {
                type: "chat_message",
                recipient_id: activeChatUserId,
                message: message
            };

            ws.send(JSON.stringify(payload));

            renderMessage({
                sender_id: user_id,
                recipient_id: activeChatUserId,
                message: message
            });

            input.value = "";
        });

        async function loadUnread() {
            const res = await fetch(`messages/unread?user_id=${user_id}`);
            unreadCounts = await res.json();
        }

        async function loadUsers() {
            await loadUnread();

            const res = await fetch(`/listusers/?user_id=${user_id}`);
            const users = await res.json();

            const container = document.getElementById("usersList");
            container.innerHTML = "";

            const unreadMap = {}
            unreadCounts.forEach(obj => {
                unreadMap[obj.sender_id] = obj.count
            })

            users.forEach(user => {
                if (user.id === user_id) return;

                const userDiv = document.createElement("div");

                // const unread = unreadCounts[user.id] || 0;
                const unread = unreadMap[user.id] || 0

                const label = unread > 0 ? `(${unread} new message)` : "";

                userDiv.innerHTML = `
            ID: ${user.id} | Name: ${user.name} ${label}
        `;

                const button = document.createElement("button");
                button.textContent = "Start Chat";
                button.onclick = () => openChat(user.id);

                userDiv.appendChild(button);
                container.appendChild(userDiv);
            });
        }

        loadUsers();
    </script>
</body>

</html>
