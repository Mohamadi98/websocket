<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Profile</title>
</head>
<body>
  <h2>User Profile</h2>

  <div>
    <button id="usersBtn">Users</button>
  </div>

  <div>
    <p><strong>ID:</strong> <span id="id">-</span></p>
    <p><strong>Name:</strong> <span id="name">-</span></p>
    <p><strong>Age:</strong> <span id="age">-</span></p>
    <!-- <p><strong>Experience Years:</strong> <span id="exp_years">-</span></p>
    <p><strong>Coach ID:</strong> <span id="coach_id">-</span></p> -->
    <p><strong>Role:</strong> <span id="role">-</span></p>
  </div>

  <script>

    document.getElementById("usersBtn").addEventListener("click", () => {
      window.location.href = "/users";
    });

    async function loadProfile() {
      const user_id = localStorage.getItem("user_id");
    //   const user_type = localStorage.getItem("user_type");
    //hardcoded for testing purposes
    // const user_id = '1'

      if (!user_id) {
        alert("User not logged in");
        window.location.href = "/home";
        return;
      }

      const res = await fetch(`profile/me?user_id=${user_id}`);
      const data = await res.json();

      // Helper to handle undefined/null
      function setField(id, value) {
        document.getElementById(id).textContent = value ?? "-";
      }

      setField("id", data.user.id);
      setField("name", data.user.name);
      setField("age", data.user.age);
      setField("role", data.user.role);
    }

    loadProfile();
  </script>
</body>
</html>
